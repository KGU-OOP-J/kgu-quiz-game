plugins {
    id 'java'
    id 'application'
}

group = 'org.kgu'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.kgu.Main'
}

test {
    useJUnitPlatform()
}

// 배포 파일 구성 시 data, config 포함
distributions {
    main {
        contents {
            from(layout.buildDirectory.dir('libs/data')) {
                into 'data'
            }

            from(layout.buildDirectory.dir('libs/config')) {
                into 'config'
            }
        }
    }
}

// 프로젝트 정리 시 data, config 경로 제외
tasks.named('clean', Delete) {
    setDelete(fileTree(layout.buildDirectory.get().asFile) {
        exclude 'libs/data/**'
        exclude 'libs/config/**'
    })
}
